[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zdte-bot"
version = "0.3.0"
description = "0DTE options trading bot for major ETFs (SPY, QQQ, IWM) on Alpaca"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.40",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zdte = "zdte_bot.cli:main"

[tool.setuptools]
packages = ["zdte_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
