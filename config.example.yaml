# zdte-bot configuration. `setup` copies this to config.yaml — edit config.yaml, not this file.
# All times are US/Eastern (market time) in 24h HH:MM.

# Which strategy to run:
#   long_options   buy a call/put on an opening-range breakout (needs options level 2)
#   credit_spread  SELL a vertical spread on the far side of the opening range
#                  (needs options level 3; see docs/RESEARCH.md for why it's included)
mode: long_options

# Underlyings to trade. These all list options that expire every trading day.
symbols: [SPY, QQQ, IWM]

# Days to sit out entirely, e.g. FOMC decisions and CPI releases (YYYY-MM-DD).
# The bot still manages anything already open on these days.
skip_dates: []
#  - 2026-10-28   # FOMC (check the Fed calendar)

# Safety switch. Even with ALPACA_PAPER=false in .env the bot refuses to trade
# real money unless this is true.
live_trading_confirmed: false

# Market data feeds. Free Alpaca accounts must use "iex" (stocks) and "indicative" (options).
# With a paid Algo Trader Plus subscription use "sip" and "opra".
stock_feed: iex
options_feed: indicative

# How often the main loop runs, in seconds.
poll_seconds: 15

schedule:
  opening_range_minutes: 15   # build the opening range from the first N minutes
  no_new_entries_after: "14:30"   # long_options mode only; profit_window.start wins if earlier
  # Close everything this bot holds, no matter what. Alpaca REJECTS orders on expiring
  # SPY/QQQ/IWM options after 15:30 ET and auto-liquidates at 15:45, so this must be <= 15:25.
  flatten_at: "15:15"

# Make the money by midday. 0DTE premium decays fastest in the afternoon, so:
#  - new entries stop at `start`
#  - from `start`, any position up at least `min_profit_pct` is closed to lock in the gain
#  - at `end`, everything still open is closed, winner or loser (if close_all_at_end)
# schedule.flatten_at (15:15) stays as the last-resort safety close.
profit_window:
  enabled: true
  start: "11:00"
  end: "13:00"
  min_profit_pct: 10          # % gain on premium paid (long_options) or % of credit kept (credit_spread)
  close_all_at_end: true

strategy:
  # Opening range breakout: buy calls when price closes above the range high,
  # puts when it closes below the range low.
  breakout_buffer_pct: 0.05   # % beyond the range edge required to count as a breakout
  require_vwap_confirm: true  # calls need price > VWAP, puts need price < VWAP
  max_range_pct: 1.0          # skip a symbol if its opening range is wider than this % (choppy open)
  max_entries_per_symbol: 1   # per day

# Used when mode: credit_spread. Defaults follow the published "60-minute ORB" 0DTE bot,
# scaled from SPX to SPY-sized strikes.
credit_spread:
  opening_range_minutes: 60
  min_range_pct: 0.2          # skip quiet opens: range narrower than this % of price
  max_range_pct: 1.5
  no_new_entries_after: "12:00"   # profit_window.start wins if earlier
  width: 2.0                  # $ between short and long strikes
  min_credit: 0.20            # per share; don't sell for less than $20 per spread
  max_risk_usd: 500           # max loss if the whole spread goes against us: (width - credit) x 100 x qty
  profit_target_pct: 50       # buy back once we've kept this % of the credit
  stop_loss_pct: 100          # buy back once the loss equals this % of the credit
  exit_on_short_strike_breach: true   # buy back if the underlying trades through the short strike

contracts:   # long_options mode (max_spread_pct also applies to the short leg of credit spreads)
  target_delta: 0.40          # abs(delta) to aim for; falls back to strike distance if greeks are missing
  max_strike_distance_pct: 1.5
  min_premium: 0.30           # per-share price, i.e. $30 per contract
  max_premium: 5.00
  max_spread_pct: 10.0        # skip contracts whose bid/ask spread is wider than this % of mid

risk:   # trade/position/daily limits apply to both modes; the rest is long_options only
  max_position_usd: 500       # max premium spent on a single trade
  max_contracts: 5
  max_open_positions: 2
  max_trades_per_day: 4
  max_daily_loss_usd: 500     # stop opening trades (and flatten) once the account is down this much today
  take_profit_pct: 50         # exit when option is up this % from entry
  stop_loss_pct: 35           # exit when option is down this % from entry
  trailing_activate_pct: 30   # once up this %, start trailing...
  trailing_stop_pct: 20       # ...and exit if it falls this % from its high

execution:
  entry_slippage: 0.25        # limit price = mid + this fraction of (ask - mid); 1.0 = pay the ask
  fill_timeout_seconds: 20    # cancel an unfilled entry after this long
  use_market_orders_for_exits: true
